services:
  db:
    image: postgres:16-alpine
    container_name: ima_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Lié à localhost uniquement : la base n'est PAS exposée sur l'IP publique du VPS.
    # L'app y accède via le réseau Docker interne (hôte db:5432).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applique les migrations + le seed, puis s'arrête. Utilise l'étape « builder »
  # (qui contient la CLI Prisma, absente de l'image finale minimale).
  migrate:
    build:
      context: .
      target: builder
    container_name: ima_migrate
    command: sh -c "npx prisma migrate deploy && node prisma/seed.mjs"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    container_name: ima_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NODE_ENV: production
    # Lié à localhost : l'app est servie au public via le reverse proxy (Nginx/Caddy), pas en direct.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
    name: ima_studio_pgdata
